# A blank issue stays available: anything that is neither a bug nor a feature request
# — a documentation error, an accessibility problem, a question about behaviour — would
# otherwise have no path into the tracker at all.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/vviinn/widgets/security/advisories/new
    about: Private advisory. Never report a vulnerability in a public issue.
  - name: Documentation and live playground
    url: https://widgets.vviinn.com
    about: Props, events, CSS parts and slots for every public component.
  - name: Integration or account support
    url: https://panel.vviinn.com
    about: Product feed, panel configuration and tokens. Or write to support@vviinn.com.
