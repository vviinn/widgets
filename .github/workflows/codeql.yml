name: CodeQL

on:
  pull_request:
    branches:
      - develop
      - main
  # Analysis of a branch establishes the baseline that its pull request alerts are
  # diffed against, so every branch accepting pull requests needs one.
  push:
    branches:
      - develop
      - main
  # New CodeQL queries find issues in code that has not changed, so analysis also
  # runs weekly on the default branch.
  schedule:
    - cron: "0 5 * * 1"

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
