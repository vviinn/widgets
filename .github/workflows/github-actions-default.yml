name: Node.js CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  NODE_VERSION: "22.23.2"
  OPENAPI_URL: ./openapi/merchant-openapi.yaml

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Create .env file
        run: echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
      - run: npm ci
      - run: npm run build_interfaces
      - run: npm run lint
      - run: npm run test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Check for high/critical vulnerabilities
        run: npm audit --audit-level=high

  security-audit-storybook:
    name: Security Audit (Storybook)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: storybook/package-lock.json
      - run: npm ci
        working-directory: storybook
      - name: Check for high/critical vulnerabilities
        run: npm audit --audit-level=high
        working-directory: storybook

  generate-version-develop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.stage.vviinn.com/product/" >> .env
      - run: npm ci
      - run: npm run test
      - run: npm run build_interfaces
      - run: npm run build
      - run: npm run release.ci
      - run: git push --follow-tags origin develop
      - run: npm run update_storybook_changelog
      - run: |
          git add ./storybook/documentation/change-log/1_changelog.mdx
          git diff --cached --quiet || (git commit -m '[skip ci] update storybook changelog' && git push origin develop)

  release-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/develop'
    needs: generate-version-develop
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11
      - run: git pull
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
          echo "API_PATH=https://api.vviinn.com" >> .env
      - run: npm ci
      - run: npm run test
      - run: npm run build_interfaces
      - run: npm run build
      # The SBOM comes from the lockfile, so it runs before the publish: a failure
      # here must not leave a package in the registry with the dependent jobs skipped.
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
      # npm cannot attest a private source repository, so --provenance joins the
      # command only once the repository is public.
      - name: Publish to NPM registry with beta tag using OIDC
        run: npm publish --tag beta --access public ${{ github.event.repository.visibility == 'public' && '--provenance' || '' }}

  update-widget-version-storybook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/develop'
    needs: release-beta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: git pull
      - run: npm run update_storybook_widget_version
      # Without the lockfile, the next pull request fails `npm ci` in the Storybook audit.
      # Retries for ~2 minutes, and only while the registry does not serve the new version yet.
      - name: Sync Storybook lockfile
        working-directory: storybook
        run: |
          for _ in 1 2 3 4 5 6; do
            npm install --package-lock-only --ignore-scripts --prefer-online 2>npm-error.log && exit 0
            grep -qE 'ETARGET|E404' npm-error.log || { cat npm-error.log; exit 1; }
            sleep 20
          done
          cat npm-error.log
          exit 1
      - run: |
          git add ./storybook/package.json ./storybook/package-lock.json
          git commit -m "[skip ci] update widget's version in storybook"
          git push origin develop

  build-app-main:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
      - run: npm ci
      - run: npm run test
      - run: npm run build_interfaces
      - run: npm run build
