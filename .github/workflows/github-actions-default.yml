name: Node.js CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  NODE_VERSION: "22.x"
  OPENAPI_URL: ./openapi/merchant-openapi.yaml

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm install
      - name: Check for high/critical vulnerabilities
        run: npm audit --audit-level=high

  generate-version-develop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.stage.vviinn.com/product/" >> .env
      - run: npm install
      - run: npm run test
      - run: npm run build_interfaces
      - run: npm run build
      - run: npm run release.ci
      - run: git push --follow-tags origin develop
      - run: npm run update_storybook_changelog
      - run: |
          git add ./storybook/documentation/change-log/1_changelog.mdx
          git diff --cached --quiet || (git commit -m '[skip ci] update storybook changelog' && git push origin develop)

  release-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/develop'
    needs: generate-version-develop
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: git pull
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
          echo "API_PATH=https://api.vviinn.com" >> .env
      - run: npm install
      - run: npm run test
      - run: npm run build_interfaces
      - run: npm run build
      - name: Publish to NPM registry with beta tag using OIDC
        run: npm publish --tag beta --access public

  update-widget-version-storybook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/develop'
    needs: release-beta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: git pull
      - run: npm run update_storybook_widget_version
      - run: |
          git add ./storybook/package.json
          git commit -m "[skip ci] update widget's version in storybook"
          git push origin develop

  build-app-main:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
      - run: npm install
      - run: npm run test
      - run: npm run build_interfaces
      - run: npm run build
