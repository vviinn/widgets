name: CI and Release

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "22.23.2"
  OPENAPI_URL: ./openapi/merchant-openapi.yaml

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Create .env file
        run: echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
      - run: npm ci
      - run: npm run build_interfaces
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      # npm audit reads only the lockfile; the Lint job already installs the root.
      # Dev tooling stays out: braces (via Jest 29, the newest Stencil supports) has no fixed release.
      - name: Check for high/critical vulnerabilities in the shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  security-audit-storybook:
    name: Security Audit (Storybook)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: storybook/package-lock.json
      # Not needed for npm audit, but the only PR check that the Storybook lockfile matches package.json.
      - run: npm ci --ignore-scripts
        working-directory: storybook
      - name: Check for high/critical vulnerabilities
        run: npm audit --audit-level=high
        working-directory: storybook

  # Keeps a release pull request open on develop from the user-facing commits.
  # It uses a vviinn-widgets-connector-app token: a pull request from GITHUB_TOKEN gets no checks.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency: release-please
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write # the branch takes in workflow changes from develop
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: develop

  # A release publishes latest, a run by hand on develop a beta. npm trusts this file for OIDC
  # publishing; !cancelled() lets the job run when a run by hand skips release-please.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      !cancelled() && (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'))
    permissions:
      contents: read
      id-token: write
    steps:
      # Build exactly the tagged release, as develop may have moved on; empty on a run by hand.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
          echo "API_PATH=https://api.vviinn.com" >> .env
      - run: npm ci
      - run: npm run test
      # The beta takes the next patch number, so it sorts after the current release, and the
      # run number keeps each one unique.
      - name: Set the beta version
        if: github.event_name == 'workflow_dispatch'
        run: |
          next_patch=$(node -p "const [major, minor, patch] = require('./package.json').version.split('.'); [major, minor, +patch + 1].join('.')")
          npm version "$next_patch-beta.${{ github.run_number }}" --no-git-tag-version
      - run: npm run build_interfaces
      - run: npm run build
      # The SBOM comes from the lockfile, so it runs before the publish: a failure
      # here must not leave a package in the registry with the dependent jobs skipped.
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
      # npm cannot attest a private source repository, so --provenance joins the
      # command only once the repository is public.
      - name: Publish to NPM registry using OIDC
        run: npm publish --tag ${{ github.event_name == 'workflow_dispatch' && 'beta' || 'latest' }} --access public ${{ github.event.repository.visibility == 'public' && '--provenance' || '' }}

  # Merges develop into main, which deploys the production Storybook. main takes changes only
  # through pull requests, and GITHUB_TOKEN may not open one here, hence the App token.
  merge-release-into-main:
    name: Merge the release into main
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write # main takes in workflow changes from develop
      - name: Merge develop into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open --json url --jq '.[0].url')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head develop \
              --title "Release $TAG" --body "Ships $TAG to main, which deploys the production Storybook.")
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge

  build-app-main:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Create .env file
        run: |
          echo "OPENAPI_URL=${{ env.OPENAPI_URL }}" >> .env
          echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
      - run: npm ci
      - run: npm run test
      - run: npm run build_interfaces
      - run: npm run build
