version: 2

updates:
  # Runtime dependencies are inlined into www/build, so a CVE in one ships inside
  # our artifact and only our release can fix it — consumers cannot patch it
  # themselves. That makes advisories worth a pull request and routine version
  # bumps not: every merge to develop cuts a beta release.
  #
  # open-pull-requests-limit: 0 is the documented way to keep the second without
  # the first — security updates ignore this limit and still open pull requests.
  # `ignore` is deliberately absent: it applies to security updates too, so
  # ignoring majors there would swallow a major-version security fix.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
