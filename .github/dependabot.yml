version: 2

updates:
  # Limit 0 drops routine version bumps; security updates ignore the limit and
  # still open pull requests. No `ignore` here — it suppresses those too.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix # release-please releases runtime dependency updates, not dev ones
      prefix-development: chore
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Listed only to make security updates explicit — the docs leave it unstated
  # whether an existing config narrows them to the directories it names.
  - package-ecosystem: npm
    directory: /storybook
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
