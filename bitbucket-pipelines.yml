# This is a sample build configuration for JavaScript.
# Check our guides at https://confluence.atlassian.com/x/14UWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: node:18.20.2

pipelines:
  branches:
    develop:
      - step:
          name: Build app
          caches:
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.stage.vviinn.com/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://api.stage.vviinn.com/product/" >> .env
            - npm install
            - npm run test
            - npm run build_interfaces
            - npm run build
      - step:
          name: Generate version
          caches:
            - node
          script:
            - npm run release.ci
            - git push --follow-tags origin develop
            - npm run update_storybook_changelog
            - git add ./storybook/documentation/changelog.mdx
            - git commit -m '[skip ci] update storybook changelog'
            - git push origin develop
      - step:
          name: Release beta
          caches:
            - node
          script:
            - git pull
            - touch .env
            - echo "OPENAPI_URL=https://docs.vviinn.com/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
            - echo "API_PATH=https://api.vviinn.com" >> .env
            - npm install
            - npm run test
            - npm run build_interfaces
            - npm run build
            - pipe: atlassian/npm-publish:1.0.0
              variables:
                NPM_TOKEN: $NPM_TOKEN
                EXTRA_ARGS: "--tag beta"
      - step:
          name: Update widget's version in Storybook
          caches:
            - node
          script:
            - git pull
            - npm run update_storybook_widget_version
            - git add ./storybook/package.json
            - git commit -m "[skip ci] update widget's version in storybook"
            - git push origin develop
    master:
      - step:
          name: Build app
          caches:
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.vviinn.com/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
            - npm install
            - npm run test
            - npm run build_interfaces
            - npm run build
  custom:
    publish:
      - step:
          name: Publish to NPM registry with beta tag
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.vviinn.com/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
            - npm install
            - npm run test
            - npm run build_interfaces
            - npm run build
            - pipe: atlassian/npm-publish:0.3.2
              variables:
                NPM_TOKEN: $NPM_TOKEN
                EXTRA_ARGS: "--tag beta"
    test:
      - step:
          name: Tests
          caches:
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.vviinn.com/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://api.vviinn.com/product/" >> .env
            - PUPPETEER_PRODUCT=firefox npm install
            - npm run build_interfaces
            - npm run test.e2e
