# You can specify a custom docker image from Docker Hub as your build environment.
image: circleci/node:15.14.0-browsers

pipelines:
  branches:
    develop:
      - step:
          name: Build app
          caches:
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.stage.mediaopt.tools/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://stage.mediaopt.tools/product/" >> .env
            - npm install
            - npm run build_interfaces
            - npm run test
            - npm run build
    master:
      - step:
          name: Build app
          caches:
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.mediaopt.tools/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://mediaopt.tools/product/" >> .env
            - npm install
            - npm run build_interfaces
            - npm run test
            - npm run build
