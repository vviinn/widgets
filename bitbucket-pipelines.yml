  #           - npm run test
  #           - npm version from-git
  #           - pipe: atlassian/npm-publish:0.3.1
  #             variables:
  #               NPM_TOKEN: $NPM_TOKEN
  custom:
    test:
      - step:
          name: Tests
          caches: 
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.mediaopt.tools/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://mediaopt.tools/product/" >> .env
            - PUPPETEER_PRODUCT=firefox npm install
            - npm run build_interfaces 
            - npm run test
