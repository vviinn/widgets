# This is a sample build configuration for JavaScript.
# Check our guides at https://confluence.atlassian.com/x/14UWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: node:10.15.3

pipelines:
  branches:
    develop:
      - step:
          name: Build app
          caches:
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.stage.ionos.mediaopt.tools/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://stage.mediaopt.tools/product/" >> .env
            - npm install
            - npm run build_interfaces
            - ls -la src/interfaces
            - npm run build
    master:
      - step:
          name: Build app
          caches:
            - node
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.mediaopt.tools/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://mediaopt.tools/product/" >> .env
            - npm install
            - npm run build_interfaces
            - ls -la src/interfaces
            - npm run build
  tags:
    'v*.*.*':
      - step:
          name: Build app and publish to NPM
          script:
            - touch .env
            - echo "OPENAPI_URL=https://docs.mediaopt.tools/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://mediaopt.tools/product/" >> .env
            - npm install
            - npm run build_interfaces
            - ls -la src/interfaces
            - npm run build
            - npm version from-git
            - pipe: atlassian/npm-publish:0.3.1
              variables:
                NPM_TOKEN: $NPM_TOKEN
  custom:
    test:
      - step:
          name: Tests
          script:
            - sudo apt install -y gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget
            - touch .env
            - echo "OPENAPI_URL=https://docs.mediaopt.tools/openapi.yaml" >> .env
            - echo "RECOMMENDATIONS_URL=https://mediaopt.tools/product/" >> .env
            - npm install
            - npm run build_interfaces 
            - npm run test