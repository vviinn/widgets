<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
    <link rel="preconnect" href="https://cdn.vviinn.com" />
    <link rel="preconnect" href="https://d1rgjmn2wmqeif.cloudfront.net" />
    <script type="module" src="/build/vviinn-widgets.esm.js"></script>
    <script nomodule src="/build/vviinn-widgets.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 20px;
    }
    vviinn-vps-button [slot] {
      visibility: hidden;
      position: absolute;
    }
    vviinn-vps-widget [slot] {
      visibility: hidden;
      position: absolute;
    }
    vviinn-vpr-widget [slot] {
      visibility: hidden;
      position: absolute;
    }
    vviinn-vpr-button [slot] {
      visibility: hidden;
      position: absolute;
    }
  </style>
  <body>
    <vviinn-vpr-widget product-id="590013-6"></vviinn-vpr-widget>
    <script>
      // Dev token lives in localStorage — set it once in the browser console:
      // localStorage.setItem("vviinn-dev-token", "YOUR_TOKEN")
      const TOKEN_WIDGETS = [
        "vviinn-cropper",
        "vviinn-results",
        "vviinn-shop-the-look",
        "vviinn-suggestions",
        "vviinn-text-search",
        "vviinn-vpr-button",
        "vviinn-vpr-widget",
        "vviinn-vps-button",
        "vviinn-vps-widget",
      ];

      const devToken = localStorage.getItem("vviinn-dev-token");
      const widgets = document.querySelectorAll(TOKEN_WIDGETS.join(","));

      if (devToken) {
        widgets.forEach((widget) => widget.setAttribute("token", devToken));
      } else if (widgets.length) {
        console.warn(
          'No dev token set. Run localStorage.setItem("vviinn-dev-token", "YOUR_TOKEN") and reload.',
        );
      }
    </script>
  </body>
</html>
