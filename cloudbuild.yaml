steps:
  - id: 'install_widgets'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        rm -rf node_modules/
        npm install
    dir: '/workspace'
  - id: 'build_widgets'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "OPENAPI_URL=./openapi/merchant-openapi.yaml" > .env
        npm run build_interfaces
        npm run build
        cp -r . /widgets
    volumes:
      - name: 'widgets_local_build'
        path: '/widgets'
    dir: '/workspace'
    waitFor: ['install_widgets']
  - id: 'build_storybook'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Cleaning node_modules..."
        rm -rf node_modules
        if [ "$_ENVIRONMENT" = "stage" ]
        then
          cp -r /widgets .
          npm pkg set dependencies.vviinn-widgets="./widgets"
        fi
        echo "Commit Hash: $(git rev-parse HEAD)"
        npm install --production=false
        npm run build-storybook
        if [ "$_ENVIRONMENT" = "production" ]
        then
          echo "Installing Playwright system dependencies..."
          if npx playwright install-deps chromium; then
            echo "Installing Playwright browsers..."
            if npm run prepare-llm-extraction; then
              echo "Generating LLM documentation..."
              npm run build-llm-docs
            else
              echo "❌ prepare-llm-extraction failed; skipping LLM docs generation" >&2
              exit 1
            fi
          else
            echo "❌ Failed to install Playwright system dependencies" >&2
            exit 1
          fi
        else
          echo "Skipping LLM docs generation (stage environment)"
        fi
    volumes:
      - name: 'widgets_local_build'
        path: '/widgets'
    dir: '/workspace/storybook'
    waitFor: ['build_widgets']
    env:
      - 'NODE_ENV=$_NODE_ENV'
      - 'NODE_OPTIONS=--openssl-legacy-provider'
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG', '.' ]
    dir: '/workspace/storybook'
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG' ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [ 'run', 'deploy', 'storybook-$_ENVIRONMENT', '--image', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG', '--region', 'europe-west1',  '--platform', 'managed' ]
