steps:
  - id: 'install_widgets'
    name: node
    entrypoint: npm
    args: ['install']
    dir: '/workspace'
  - id: 'build_widgets'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        npm run build
        cp -r dist /widgets
    volumes:
      - name: 'widgets_local_build'
        path: '/widgets'
    dir: '/workspace'
    waitFor: ['install_widgets']
  - id: 'install_storybook'
    name: node
    entrypoint: npm
    args: ['install']
    dir: '/workspace/storybook'
  - id: 'build_storybook'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        rm -rf dist
        mv /widgets/dist .
        ls -la .
        npm run build-storybook
    volumes:
      - name: 'widgets_local_build'
        path: '/widgets'
    dir: '/workspace/storybook'
    waitFor: ['install_storybook', 'build_widgets']
    env:
      - 'NODE_ENV=development'
