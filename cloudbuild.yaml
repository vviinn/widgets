steps:
  - id: "install_widgets"
    name: node:22
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        rm -rf node_modules/
        npm install
    dir: "/workspace"
  - id: "build_widgets"
    name: node:22
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "OPENAPI_URL=./openapi/merchant-openapi.yaml" > .env
        npm run build_interfaces
        npm run build
        cp -r . /widgets
    volumes:
      - name: "widgets_local_build"
        path: "/widgets"
    dir: "/workspace"
    waitFor: ["install_widgets"]
  - id: "build_storybook"
    name: node:22
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "Cleaning node_modules..."
        rm -rf node_modules
        if [ "$_ENVIRONMENT" = "stage" ]
        then
          cp -r /widgets .
          npm pkg set dependencies.vviinn-widgets="./widgets"
        fi
        echo "Commit Hash: $(git rev-parse HEAD)"
        npm install --production=false
        npm run build-storybook
        if [ "$_ENVIRONMENT" = "production" ]
        then
          echo "Installing Playwright system dependencies..."
          if npx playwright install-deps chromium; then
            echo "Installing Playwright browsers (max 10 min)..."
            if timeout 600 npm run prepare-llm-extraction; then
              echo "Generating LLM documentation..."
              if ! npm run build-llm-docs; then
                echo "⚠️  build-llm-docs failed; deploying storybook with stale LLM docs" >&2
              fi
            else
              echo "⚠️  playwright install timed out or failed; deploying storybook with stale LLM docs" >&2
            fi
          else
            echo "⚠️  playwright install-deps failed; deploying storybook with stale LLM docs" >&2
          fi
        else
          echo "Skipping LLM docs generation (stage environment)"
        fi
    volumes:
      - name: "widgets_local_build"
        path: "/widgets"
    dir: "/workspace/storybook"
    waitFor: ["build_widgets"]
    env:
      - "NODE_ENV=$_NODE_ENV"
      - "NODE_OPTIONS=--openssl-legacy-provider"
    secretEnv:
      - "STORYBOOK_TOKEN_HOME_LIVING"
      - "STORYBOOK_TOKEN_FASHION"
      - "STORYBOOK_TOKEN_MANUFACTURER_SPARE_PARTS"
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG", "."]
    dir: "/workspace/storybook"
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "storybook-$_ENVIRONMENT",
        "--image",
        "eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG",
        "--region",
        "europe-west1",
        "--platform",
        "managed",
      ]
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/storybook-token-home-living/versions/latest
      env: "STORYBOOK_TOKEN_HOME_LIVING"
    - versionName: projects/$PROJECT_ID/secrets/storybook-token-fashion/versions/latest
      env: "STORYBOOK_TOKEN_FASHION"
    - versionName: projects/$PROJECT_ID/secrets/storybook-token-manufacturer-spare-parts/versions/latest
      env: "STORYBOOK_TOKEN_MANUFACTURER_SPARE_PARTS"
