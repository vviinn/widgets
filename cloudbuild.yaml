steps:
  - id: 'install_widgets'
    name: node
    entrypoint: npm
    args: ['install']
    dir: '/workspace'
  - id: 'build_widgets'
    name: node
    entrypoint: npm
    args: ['run', 'build']
    dir: '/workspace'
    waitFor: ['install_widgets']
  - id: 'install_storybook'
    name: node
    entrypoint: npm
    args: ['install']
    dir: '/workspace/storybook'
  - id: 'build_storybook'
    name: node
    entrypoint: npm
    args: ['run', 'build-storybook']
    dir: '/workspace/storybook'
    waitFor: ['install_storybook', 'build_widgets']
    env:
      - 'NODE_ENV=development'
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG', '.' ]
    dir: '/workspace/storybook/storybook-static'
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG' ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [ 'run', 'deploy', 'storybook-$_ENVIRONMENT', '--image', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG', '--region', 'europe-west1',  '--platform', 'managed' ]
