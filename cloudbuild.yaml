steps:
  - id: 'install_widgets'
    name: node
    entrypoint: npm
    args: ['install']
    dir: '/workspace'
  - id: 'build_widgets'
    name: node
    entrypoint: npm
    args: ['run', 'build']
    dir: '/workspace'
    waitFor: ['install_widgets']
  - id: 'install_storybook'
    name: node
    entrypoint: npm
    args: ['install']
    dir: '/workspace/storybook'
  - id: 'build_storybook'
    name: node
    entrypoint: npm
    args: ['run', 'build-storybook']
    dir: '/workspace/storybook'
    waitFor: ['install_storybook', 'build_widgets']
    env:
      - 'NODE_ENV=development'
