steps:
  - id: 'install_widgets'
    name: node
    entrypoint: npm
    args: ['install']
    dir: '/workspace'
  - id: 'build_widgets'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        npm run build
        cp -r . /widgets
    volumes:
      - name: 'widgets_local_build'
        path: '/widgets'
    dir: '/workspace'
    waitFor: ['install_widgets']
  - id: 'install_storybook'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ "$_ENVIRONMENT" = "stage" ]
        then
          cp -r /widgets .
          npm pkg set dependencies.vviinn-widgets="./widgets"
        fi
        npm install
    dir: '/workspace/storybook'
  - id: 'build_storybook'
    name: node
    entrypoint: bash
    args:
      - '-c'
      - |
        export NODE_OPTIONS=--openssl-legacy-provider
        npm run build-storybook
    volumes:
      - name: 'widgets_local_build'
        path: '/widgets'
    dir: '/workspace/storybook'
    waitFor: ['install_storybook', 'build_widgets']
    env:
      - 'NODE_ENV=$_NODE_ENV'
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG', '.' ]
    dir: '/workspace/storybook'
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG' ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [ 'run', 'deploy', 'storybook-$_ENVIRONMENT', '--image', 'eu.gcr.io/$PROJECT_ID/storybook:$_DOCKER_TAG', '--region', 'europe-west1',  '--platform', 'managed' ]
