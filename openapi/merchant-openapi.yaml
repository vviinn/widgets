    category-path:
      type: string
      description: |
        In a category tree, a category path identifies a category of the tree.
        The API expects and returns each category path only in encoded form.

        A category path is a sequence category labels, separated by the `>` character.
        Whitespace around the category labels is ignored.
        If the `>` character is part of a category label, it must be escaped with `%3E`.
        The root node has no label and is omitted in a category path.
        To represent the root node, use `root` as the sole label instead.

        Consider the following category tree:
        ```
        .
        ├── Furniture
        │   ├── Benches
        │   └── Cabinets & Storage
        └── Home & Garden
            ├── Plants
            ├── Wood Stoves
            └── Fish Pond (<><)
        ```

        That contains the following category paths:
        - `root`
        - `Furniture`
        - `Furniture > Benches`
        - `Furniture > Cabinets & Storage`
        - `Home & Garden`
        - `Home & Garden > Plants`
        - `Home & Garden > Wood Stoves`
        - `Home & Garden > Fish Pond (<%3E<)`

        Category paths are transmitted in encoded form.
        To this end, we use the [Base64-URL](https://datatracker.ietf.org/doc/html/rfc4648#section-5) encoding without any padding.
        The category paths above are encoded as follows:
        - `cm9vdA`
        - `RnVybml0dXJl`
        - `RnVybml0dXJlID4gQmVuY2hlcw`
        - `RnVybml0dXJlID4gQ2FiaW5ldHMgJiBTdG9yYWdl`
        - `SG9tZSAmIEdhcmRlbg`
        - `SG9tZSAmIEdhcmRlbiA-IFBsYW50cw`
        - `SG9tZSAmIEdhcmRlbiA-IFdvb2QgU3RvdmVz`
        - `SG9tZSAmIEdhcmRlbiA-IEZpc2ggUG9uZCAoPCUzRTwp`
        
        On Linux, the `basenc` command can be used to encode category paths:
        ```bash
        echo -n 'Furniture > Cabinets & Storage' | basenc -w0 --base64url
        # returns: RnVybml0dXJlID4gQ2FiaW5ldHMgJiBTdG9yYWdl
        echo -n 'RnVybml0dXJlID4gQ2FiaW5ldHMgJiBTdG9yYWdl' | basenc -d -w0 --base64url
        # returns: Furniture > Cabinets & Storage
        ```
      example:
        - RnVybml0dXJl
        - SG9tZSAmIEdhcmRlbg
    rectangle:
      type: object
      properties:
        left:
          type: number
          example: 0.1728
          description: the relative distance to the left edge of the image
        top:
          type: number
          example: 0.3641
          description: the relative distance to the top edge of the image
        width:
          type: number
          example: 0.4575
          description: the width relative to the image's width
        height:
          type: number
          example: 0.2917
