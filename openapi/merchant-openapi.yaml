              images:
                type: array
                items:
                  $ref: "#/components/schemas/product-annotation-images"
    similar-products:
      description: Similar Products request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/similar-products-request"
    cross-selling:
      description: Cross Selling request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/cross-selling-request"
    text-search:
      description: Text Search request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/text-search-request"
    auto-suggest:
      description: Auto Suggest request body
      content:
