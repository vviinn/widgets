    response-dynamic-filters:
      type: array
      items:
        oneOf:
          - $ref: "#/components/schemas/response-categorical-filter-item"
          - $ref: "#/components/schemas/response-interval-filter-item"
    request-dynamic-filters:
      type: array
      description: |
        The dynamic filters are parameters that refine the already narrowed down dataset from the `staticFilters` based on real-time request criteria.
        These filters are flexible and can be adjusted dynamically to specific user queries or requirements, allowing for further granular filtering.
        They provide a more precise result based on the user's immediate needs.
      items:
        $ref: "#/components/schemas/request-dynamic-filter-item"
    request-object-detection:
      type: object
      properties:
        include:
          type: boolean
          description: if true, objects in the image will be detected and returned as suggested search areas
      required:
        - include
    request-static-filters:
      type: object
      description: |
        The static filters are predefined parameters that set the initial scope for the data retrieval process.
        These filters are configured to extract a broad, meaningful set of results based on your criteria.
        Once applied, they help in reducing the dataset to a manageable and relevant subset before any further, more granular filtering occurs via `dynamicFilters`.
      properties:
        excluded:
          $ref: "#/components/schemas/excluded"
        included:
          $ref: "#/components/schemas/included"
    interactions:
      type: object
      required:
        - dynamicFilters
      properties:
        dynamicFilters:
          $ref: "#/components/schemas/response-dynamic-filters"
        suggestedSearchAreas:
          type: array
          items:
            $ref: "#/components/schemas/suggested-search-area"
        redirect:
          $ref: "#/components/schemas/redirect"
    suggested-search-area:
      type: object
      properties:
        rectangle:
          $ref: "#/components/schemas/rectangle"
      required:
        - rectangle
    redirect:
      type: object
      properties:
        url:
          description: The URL to which the user should be redirected.
          type: string
          format: uri
          example: "https://www.example.com/some-category"
      required:
        - url
    stream:
      description: |
        A stream guides a user to fulfilling an intent by providing precise and relevant insights.
        
        The engine behind a stream can be likened to an assistant that continuously observes the user's actions and tries to reconcile it with the product catalog.
        As soon as the imagined assistant sees an opportunity to help, it provides stream items.
        They can be presented to the user in a chat-like interface and be acted upon by the user.
        Alternatively, they can be processed automatically, to act on unambiguous, high-confidence suggestions.
        
        An important distinction to interactions is a stream's requirement for precision and a higher threshold for relevance:
        For the former, the interactions might contain multiple filters with many options, whereas a stream would suggest only a single filter with ideally only one option.
        For the latter, an interaction might contain filter options that are unlikely to be relevant, whereas a stream would never suggest such options.
        That is, the interactions give the user the full flexibility to explore, whereas a stream guides the user by focusing on an intent.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/stream-item"
      required:
        - items
    stream-item:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/role"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/stream-part"
      required:
        - role
        - parts
    role:
      type: string
      description: |
        A stream involves multiple actors, each with a different purpose and capabilities.
        They are distinguished by their `role` in the stream:
        
        * The `assistant` is the part of the system that drives the stream, usually by means of AI.
        * Items produced by the `system` initiate the stream's context, usually, by defining the assistant's goals, means and limitations.
        * The `user` is the person who interacts with the system, e.g., a customer.
        * The `client` receives the stream and processes it for the user.
          This can be as simple as rendering the stream in a chat interface;
          or as complex as reacting automatically to stream items, e.g., by automatically applying a filter.
        
        The distinction between `user`, `client` and `assistant` is crucial:
        It allows to produce effects on the frontend that are not initiated by the user, but requested by the assistant.
        Likewise, information from the frontend can flow to the assistant, without involving the user.
      enum:
        - assistant
        - system
        - user
        - client
      example: assistant
    stream-part:
      type: object
      properties:
        text:
          $ref: "#/components/schemas/context"
        inlineData:
          $ref: "#/components/schemas/blob"
        functionCall:
          $ref: "#/components/schemas/function-call"
        functionResponse:
          $ref: "#/components/schemas/function-response"
        fileData:
          $ref: "#/components/schemas/file-data"
    context:
      type: object
      description: |
        A context item summarizes the current situation and informs about next steps.
        It is composed of text (`content`) and structured data (`annotations`), intended for the `user` and `client`, respectively.
        With this separation, the content can be arranged in a human-readable way, without any need for further processing.
        However, the client can use an annotation to replace its referenced part of the content with a more meaningful representation, e.g., product cards.
      properties:
        content:
          type: string
          format: markdown
          description: The content is human-readable markdown text, intended for the user.
          example: |
            You are looking for a couch. We have two categories that might be of particular interest to you:
            
            * [Lounge](https://www.example.com/lounge)
            * [Divan](https://www.example.com/divan)
            
            They represent different kinds of couches.
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/context-annotation"
      required:
        - content
        - annotations
    context-annotation:
      type: object
      description: |
        A context annotation provides structured information about a specific part of a context's content.
        
        The `locator` describes the part of the text that the annotation refers to.
        The `data` contains the structured information related to the part referred to by the annotation, e.g., the part's contained products.
        The `interactions` describe how the user can interact with the annotation or its parts, e.g., by setting a filter when clicking on a card.
      properties:
        locator:
          type: object
          description: This object describes the location of what the annotation refers to.
          properties:
            start:
              type: integer
              description: The position of the annotation's first character in the text
              example: 98
            length:
              type: integer
              description: The annotation's length in the text
              example: 83
          required:
            - start
            - length
        data:
          discriminator:
            propertyName: type
            mapping:
              products: "#/components/schemas/context-annotation-data-products"
          oneOf:
            - $ref: "#/components/schemas/context-annotation-data-products"
        interactions:
          $ref: "#/components/schemas/interactions"
      required:
        - locator
        - data
        - interactions
    context-annotation-data-products:
      type: object
      properties:
        type:
          type: string
          enum:
            - products
          example: products
        items:
          type: array
          items:
            $ref: "#/components/schemas/response-product-item"
      required:
        - type
        - items
    blob:
      type: object
      description: A `blob` is used to transfer binary data within a stream, e.g., an image uploaded by the user.
      properties:
        mimeType:
          type: string
          example: "image/png"
        data:
          type: string
          format: base64
          example: iVBORw0KGgoAAAANSUhEUgAAAAMAAAADCAYAAABWKLW/AAAABHNCSVQICAgIfAhkiAAAACxJREFUCJkFwQENACAMBLEjwQMOZvMxg4H5QAgqjpZGfZHSeRmwxGyg9Bgb/YMgFBc0Hx5MAAAAAElFTkSuQmCC
    function-call:
      type: object
      description: |
        A `function-call` represents an invocation of a function.
        
        In most cases, a function is executed by the assistant, e.g., to predict a category based on the user's input.
        However, a function can also be executed by the client, e.g., to automatically set a filter.
        In that case, the assistant can only request the client to execute a function.
        To do so, the assistant needs to be aware of the functions supported by the client.
      properties:
        id:
          type: string
          description: If set, the result of this function call is required to have the same id.
        name:
          type: string
          description: The name of the function to be called.
        args:
          type: object
      required:
        - name
    function-response:
      type: object
      description: |
        A `function-response` contains the result of a function call.
        
        The client can show the structured data in the response in a more meaningful way, e.g., by using a dedicated UI component.
      properties:
        id:
          type: string
          description: If a function call has an id, the function response must use the same id.
        name:
          type: string
          description: The name of the function that was called.
        response:
          type: object
      required:
        - name
        - response
    file-data:
      type: object
      description: "`file-data` references an uploaded file in a stream, thus avoiding to repeatedly sending the same file."
      properties:
        mimeType:
          type: string
          example: "image/png"
        fileUri:
          type: string
          format: uri
          example: "https://example.com/path/to/file.png"
    request-substitutions:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/category"
        price:
          $ref: "#/components/schemas/price"
    response-substitutions:
      type: array
      items:
        $ref: "#/components/schemas/response-substitution-item"
    response-substitution-item:
      type: object
      required:
        - column
        - value
      properties:
        column:
          type: string
          enum:
            - product_type
            - google_product_category
            - price
        value:
          oneOf:
            - $ref: "#/components/schemas/label-value-item"
            - type: array
              items:
                $ref: "#/components/schemas/label-value-item"
    value-list:
      type: object
      properties:
        column:
          type: string
          example: brand
        values:
          type: array
          items:
            type: string
          example:
            - "Nike"
            - "Puma"
    string-list:
      type: array
      items:
        type: string
      example:
        - "Nike"
        - "Puma"
    succinct-color-filter-response:
      type: object
      required:
        - value
        - name
      properties:
        value:
          type: string
          example: "beige"
        name:
          type: string
          example: "beige"
    full-color-filter-response:
      required:
        - value
        - name
        - hexCode
        - rgb
        - family
      allOf:
        - $ref: "#/components/schemas/succinct-color-filter-response"
        - type: object
          properties:
            hexCode:
              type: string
              example: "#C7B3A8"
            rgb:
              $ref: "#/components/schemas/rgb"
            family:
              type: string
              example: "beige"
    rgb:
      type: object
      properties:
        red:
          type: integer
          example: 199
        green:
          type: integer
          example: 179
        blue:
          type: integer
          example: 168
    color-list-includes-rgb-code:
      type: array
      items:
        type: string
      example:
        - "black > #1A1A1A"
        - "beige > #C7B3A8"
    color-list:
      type: array
      items:
        type: string
      example:
        - "black"
        - "beige"
    interval-filter-value-item:
      type: object
      properties:
        frequency:
          description: |
            Share (0 to 1) of the hits with a value in this column that fall into this range. A grouped hit
            falls into every range one of its variants falls into, so the same hit can count in several
            ranges and the shares can sum to more than 1.
          type: number
        interval:
          $ref: "#/components/schemas/interval"
    interval-list:
      type: array
      items:
        $ref: "#/components/schemas/interval"
    interval:
      description: The interval object that is defined by a [start, end).
      type: object
      properties:
        start:
          type: number
        end:
          type: number
    visual-product-recommendations:
      type: object
      properties:
        bestFits:
          type: array
          items:
            type: string
          example:
            - "b56764137ca959da9541bb28c1987d6c"
            - "b5685a5230f5050475f214b4bb0e239b"
            - "b56c560872da93602ff88c7267eb4774"
            - "d861ad687c60820255dbf8f88516f24d"
        extended:
          $ref: "#/components/schemas/response-products"
    predict-product:
      type: object
      properties:
        attributes:
          type: array
          items:
            type: string
    predicted-product:
      type: object
      properties:
        id:
          description: the id of the product to which the predictions belong
          type: string
          example: 0010020000VR
        attributes:
          description: each object represents a field of the product with its predicted value
          type: array
          items:
            $ref: "#/components/schemas/predicted-attribute"
        images:
          description: each object represents an image of the product with its predicted fields
          type: array
          items:
            $ref: "#/components/schemas/predicted-image"
      required:
        - id
        - attributes
        - images
    predicted-image:
      type: object
      properties:
        url:
          description: the url that identifies the image
          type: string
          example: "https://www.example.org/image.jpg"
        attributes:
          description: each object represents an attribute of the image with its predicted value
          type: array
          items:
            $ref: "#/components/schemas/predicted-attribute"
      required:
        - url
        - attributes
    predicted-attribute:
      description: this object contains a prediction for an attribute
      type: object
      properties:
        name:
          description: the attribute's name
          type: string
          example: color
        value:
          description: the attribute's known value (according to the product catalog)
          nullable: true
          example: red
        prediction:
          description: the attribute's predicted value
          nullable: true
          example: orange
        confirmed:
          description: the value that was confirmed by a user
          nullable: true
          example: peach
      required:
        - name
        - value
        - prediction
    delete-product-images-by-productId:
      type: object
      properties:
        site-id:
          type: integer
          example: 25
        product-id:
          type: string
          example: "100258"
        image-ids:
          type: array
          items: { }
          example:
            - "1"
            - "2"
  requestBodies:
    product-annotation:
      description: Product data object
      content:
        application/json:
          schema:
            type: object
