          type: string
          nullable: true
        custom_label_2:
          type: string
          nullable: true
        custom_label_3:
          type: string
          nullable: true
        custom_label_4:
          type: string
          nullable: true
        attributes:
          type: object
          description: |
            The product's values for the attributes named in `siblings.options`, keyed by the
            attribute's name; `null` where the product has no value. In addition, the attributes that
            every variant carries independently of the options; each of them is absent where the product
            has no value.
          additionalProperties:
            $ref: "#/components/schemas/attribute-value"
          example:
            color:
              - value: "beige > #c7b3a8"
                name: "beige"
                hexCode: "#c7b3a8"
                rgb:
                  red: 199
                  green: 179
                  blue: 168
                family: "beige"
            size: "M"
            link: "https://www.example.com/shirt?color=beige&size=M"
        siblings:
          type: object
          nullable: true
          description: |
            The other variants the site groups with this product (for example the other colors and sizes
            of one shirt) and the attributes that vary across the product and these variants together.
            All of them share the product's `groupId`.

            It is `null` if the product was not grouped with other variants. Variants are grouped only
            if the site groups variants, and only among the results of a search or a recommendation.
          required:
            - options
            - items
          properties:
            options:
              description: |
                The attributes that vary across the group, each with the distinct values it takes.
                The values are those of this product and its siblings together, so a value that only
                this product has is listed as well. The list is empty if no attribute varies.
              type: array
              items:
                $ref: "#/components/schemas/sibling-option"
            items:
              description: |
                The other variants grouped with this product that are relevant to the request.
              type: array
              items:
                $ref: "#/components/schemas/sibling-item"
    sibling-option:
      type: object
      required:
        - name
        - values
      properties:
        name:
          description: |
            The attribute's name. The product's `attributes` and the `attributes` of every sibling
            have an entry under this name.
          type: string
          example: size
        values:
          description: |
            The distinct values of the attribute. They do not say which combinations of values exist;
            the `attributes` of the product and of each sibling do.
          type: array
          items:
            $ref: "#/components/schemas/attribute-value"
          example:
            - "M"
            - "L"
    sibling-item:
      description: A variant grouped with the product.
      type: object
      required:
        - productId
        - images
        - attributes
      properties:
        productId:
          type: string
          example: 7b0a1c7f5d2e4a6f9c3b8d1e2f4a6c8e
        images:
          description: All images of the variant, in the order of the catalog. The list can be empty.
          type: array
          items:
            $ref: "#/components/schemas/image"
        attributes:
          description: |
            The variant's values for the attributes named in `siblings.options`, keyed by the
            attribute's name; `null` where the variant has no value. In addition, the attributes that
            every variant carries independently of the options; each of them is absent where the variant
            has no value.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/attribute-value"
          example:
            color:
              - value: "blau"
                name: "blau"
            size: "L"
            link: "https://www.example.com/shirt?color=blau&size=L"
    attribute-value:
      description: |
        The value of one attribute of one product. Its form depends on the attribute's type:
        * a string, a number or a boolean for an attribute of that type,
        * a list of colors for a color attribute: all colors of the product form one value, so a
          two-colored product differs from a one-colored one, and
        * a list of paths for an attribute whose values are paths in a tree, such as a category.

        In an `attributes` object it is `null` where the product has no value for an attribute named in
        `siblings.options`.
      anyOf:
        - type: string
          nullable: true
        - type: number
        - type: boolean
        - type: array
          items:
            $ref: "#/components/schemas/color-value"
        - type: array
          items:
            $ref: "#/components/schemas/path-value"
    path-value:
      description: A path in a tree, given as the list of its labels from the top level down.
      type: array
      items:
        type: string
      example:
        - "Furniture"
        - "Benches"
    color-value:
      description: |
        A color. `hexCode`, `rgb` and `family` are present only if they are known for the color.
      type: object
      required:
        - value
        - name
      properties:
        value:
          type: string
          example: "beige > #c7b3a8"
        name:
          type: string
          example: "beige"
        hexCode:
          type: string
          example: "#c7b3a8"
        rgb:
          $ref: "#/components/schemas/rgb"
        family:
          type: string
          example: "beige"
    item-kind:
      deprecated: true
      description: |
        This field is superseded by the entity type and therefore deprecated.
      type: string
      enum:
        - product
        - content
    entity-type:
      description: |
        The API usually returns products; it can also return entities representing something else.
        To enable different handling of these entities, the API uses an `entity-type` to distinguish between them, namely:
        * A `product` entity represents a product in the catalog.
        * A `content` entity contains information relevant to a user, e.g., trends, opening hours.
        * A `list` entity comprises a collection of distinguishable items, e.g., a category page.
      type: string
      enum:
        - product
        - content
        - list
