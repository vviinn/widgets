    visual-search-request:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/request-id"
        query:
          type: object
          properties:
            image:
              type: string
              format: byte
              example: iVBORw0KGgoAAAANSUhEUgAAAAMAAAADCAYAAABWKLW/AAAABHNCSVQICAgIfAhkiAAAACxJREFUCJkFwQENACAMBLEjwQMOZvMxg4H5QAgqjpZGfZHSeRmwxGyg9Bgb/YMgFBc0Hx5MAAAAAElFTkSuQmCC
              description: |
                This image is used for finding products.
                
                The image will be temporarily stored on the server-side, enabling subsequent requests to omit the image.
                In that case, the `requestId` must be set in the request.
                
                When sending, it should be either the base64-encoded image or a data URL containing an image in base64 encoding.
            url:
              type: string
              format: uri
              example: "https://example.com/product-image.jpg"
              description: |
                URL of the image to use for finding products.
                Either `image` or `url` must be provided. If both are given, `image` takes precedence.
                When using a URL, `highResolutionImage` is not needed and will be ignored,
                as the image is fetched server-side at full resolution.
            highResolutionImage:
              type: string
              format: byte
              example: iVBORw0KGgoAAAANSUhEUgAAAAMAAAADCAYAAABWKLW/AAAABHNCSVQICAgIfAhkiAAAACxJREFUCJkFwQENACAMBLEjwQMOZvMxg4H5QAgqjpZGfZHSeRmwxGyg9Bgb/YMgFBc0Hx5MAAAAAElFTkSuQmCC
              description: |
                In addition to the `image`, a high resolution image can be uploaded to ensure accurate results when using a search area.
                Before sending a high resolution image, we recommend to send a small image initially to have results early.

                When sending, it should be either the base64-encoded image or a data URL containing an image in base64 encoding.

                Ignored when `url` is used.
            searchArea:
              type: object
              oneOf:
                - $ref: "#/components/schemas/rectangle"
              description: |
                The search area defines a region within the image;
                the results will be based on this region instead of the entire image.
                
                If a high resolution image has been uploaded, the search area will be based on the high resolution image.
        resultsCount:
