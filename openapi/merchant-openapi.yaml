      description: |
        A rectangle is defined by the position of its top-left corner and its side lengths.
        Each value is relative to an image's dimensions, i.e., they are in the range `[0, 1]`.
        The top-left corner is defined to be at `(0, 0)`, the bottom-right corner at `(1, 1)`.
