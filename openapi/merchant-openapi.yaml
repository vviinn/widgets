openapi: 3.0.2
info:
  title: API Reference
  version: "1.32.0"
  x-logo:
    url: https://docs-api-production-fdiv762nra-ew.a.run.app/logo.png
    altText: vviinn
    href: https://www.vviinn.com
tags:
  - name: services
    x-displayName: Services
  - name: product_management
    x-displayName: Product Management
  - name: mcp
    x-displayName: Model Context Protocol (MCP)
  - name: category_path
    x-displayName: Category Path
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/category-path" />
x-tagGroups:
  - name: Endpoints
    tags:
      - services
      - product_management
      - mcp
  - name: Concepts
    tags:
      - category_path
servers:
  - url: "https://api.vviinn.com"
paths:
  /product/{product-id}:
    parameters:
      - $ref: "#/components/parameters/product-id"
    put:
      security:
        - site-credentials: [ ]
      tags:
        - product_management
      summary: Set Product
      operationId: SetProduct
      description: Creates a new product or updates an existing one
      requestBody:
        $ref: "#/components/requestBodies/product-annotation"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product-annotation"
        "400":
          description: Could not save or publish the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product-annotation-error"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
    delete:
      security:
        - site-credentials: [ ]
      tags:
        - product_management
      summary: Delete Product
      operationId: DeleteProduct
      description: Deletes product and its images from a site on a given product id
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/delete-product-images-by-productId"
        "400":
          description: Could not delete the image
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Could not delete the image
                  data:
                    $ref: "#/components/schemas/delete-image-error"
                  debug:
                    type: string
                    example: exception message
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
        "404":
          description: Unable to find any image of the product
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unable to find any image of the product.
                  data:
                    $ref: "#/components/schemas/delete-image-error"
  /similar-products:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      summary: Similar Products
      operationId: GetSimilarProducts
      description: |
        This endpoint allows to discover products similar to the source product, usually chosen by a user.
        The response contains a list of similarities for each product.
      requestBody:
        $ref: "#/components/requestBodies/similar-products"
      responses:
        "200":
          $ref: "#/components/responses/similar-products"
        "400":
          $ref: "#/components/responses/generic-error"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
        "404":
          $ref: "#/components/responses/generic-error"
        "422":
          $ref: "#/components/responses/generic-error"
  /cross-selling:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      summary: Cross-Selling
      operationId: GetCrossSellingProducts
      description: |
        This endpoint suggests related products based on a source product, usually chosen by a user.
        The response contains a list of suggestions for each product.
      requestBody:
        $ref: "#/components/requestBodies/cross-selling"
      responses:
        "200":
          $ref: "#/components/responses/cross-selling"
        "400":
          $ref: "#/components/responses/generic-error"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
        "404":
          $ref: "#/components/responses/generic-error"
        "422":
          $ref: "#/components/responses/generic-error"
  /text-search:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      summary: Text-Search Products
      description: |
        This endpoint allows you to search with text query in textual attributes and visual features.
        The response contains the search result for each product.
      operationId: TextSearchProducts
      requestBody:
        $ref: "#/components/requestBodies/text-search"
      responses:
        "200":
          $ref: "#/components/responses/text-search"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /auto-suggest:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      summary: Auto-Suggest
      description: |
        This endpoint returns auto-complete suggestions for a partial search query.
        Each suggestion completes the entered text and may carry a direct link (`url`) —
        for example to a product or a landing page when a campaign maps the query to a specific target.
      operationId: AutoSuggest
      requestBody:
        $ref: "#/components/requestBodies/auto-suggest"
      responses:
        "200":
          $ref: "#/components/responses/auto-suggest"
        "401":
          $ref: "#/components/responses/generic-error"
        "403":
          $ref: "#/components/responses/generic-error"

  /visual-search:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      summary: Visual-Search Products
      tags:
        - services
      description: |
        This endpoint allows you to search with an image in visual features and textual attributes. 
        The response contains the search result for each product.
      operationId: VisualSearchProducts
      requestBody:
        $ref: "#/components/requestBodies/visual-search"
      responses:
        "200":
          $ref: "#/components/responses/visual-search"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /search/session:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      deprecated: true
      summary: New Visual Search Session
      operationId: CreateSearchSession
      description: Starts a reusable search session for a one image.
      parameters:
        - $ref: "#/components/parameters/campaign-id"
        - $ref: "#/components/parameters/excluded"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/ion-visual-product-search"
        "400":
          description: ProductSearch exception
          content:
            application/json:
              example:
                message: Could not start search session
                data: ""
                debug: Passed images count to this endpoint are invalid or not enough.
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /search/session/{search-id}:
    get:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      deprecated: true
      summary: Visual Search in Existing Session
      operationId: SearchInExistingSession
      description: Starts a search in existing session.
      parameters:
        - name: search-id
          required: true
          in: path
          schema:
            type: string
            example: "602d20ad1ac7d8-15165248"
        - $ref: "#/components/parameters/campaign-id"
      responses:
        "200":
          $ref: "#/components/responses/ion-visual-product-search"
        "400":
          description: ProductSearch exception
          content:
            application/json:
              example:
                message: Could not start search session
                data: ""
                debug: Passed images count to this endpoint are invalid or not enough.
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /search/session/{search-id}/detect-objects:
    get:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      deprecated: true
      summary: Object Detection in Existing Visual Search Session
      operationId: DetectObjectsOfImageInExistingSession
      description: Get detected objects of image in existing session.
      parameters:
        - name: search-id
          required: true
          in: path
          schema:
            type: string
            example: "602d20ad1ac7d8-15165248"
        - $ref: "#/components/parameters/campaign-id"
      responses:
        "200":
          $ref: "#/components/responses/ion-detected-objects"
        "400":
          description: ProductSearch exception
          content:
            application/json:
              example:
                message: Could not detect objects
                data: ""
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /search/session/{search-id}/upload-image:
    put:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      deprecated: true
      summary: High Resolution Image for Existing Visual Search Session
      operationId: UploadHighResolutionImageToExistingSession
      description: Upload high resolution image to existing session.
      parameters:
        - name: search-id
          required: true
          in: path
          schema:
            type: string
            example: "602d20ad1ac7d8-15165248"
        - $ref: "#/components/parameters/campaign-id"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
        "400":
          description: ProductSearch exception
          content:
            application/json:
              example:
                message: Upload image failed
                data: ""
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /product-listing-page:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - alpha
      summary: Product listing page
      description: |
        This endpoint returns a list of filtered products.
        The response contains the products.
      operationId: ProductListingPage
      requestBody:
        $ref: "#/components/requestBodies/product-listing-page"
      responses:
        "200":
          $ref: "#/components/responses/product-listing-page"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /product/{product-id}/predicted-attributes:
    post:
      security:
        - site-credentials: [ ]
      tags:
        - services
      summary: Predict Product Data
      description: |
        This endpoint predicts the fields of a single product, already existing in your product catalog.
        In addition to the fields of the products, the response also contains information about the product's images.
      operationId: predictProductAttributes
      parameters:
        - $ref: "#/components/parameters/product-id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/predict-product"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/predicted-product"
        "400":
          $ref: "#/components/responses/generic-error"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
        "404":
          $ref: "#/components/responses/generic-error"
        "422":
          $ref: "#/components/responses/generic-error"
        "500":
          $ref: "#/components/responses/generic-error"
  /product/{product-id}/similar-products:
    get:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      deprecated: true
      summary: Similar Products
      operationId: GetSimilarProductsToInputImage
      description: |
        This endpoint allows to discover products similar to the source product, usually chosen by a user.
        The response contains a list of similarities for each product.
      parameters:
        - $ref: "#/components/parameters/product-id"
        - name: similar-products-count
          in: query
          schema:
            $ref: "#/components/schemas/resultsCount"
        - $ref: "#/components/parameters/campaigns"
        - $ref: "#/components/parameters/image-code"
        - $ref: "#/components/parameters/color"
        - $ref: "#/components/parameters/excluded"
        - $ref: "#/components/parameters/category"
      responses:
        "200":
          $ref: "#/components/responses/visual-product-recommendation"
        "400":
          $ref: "#/components/responses/generic-error"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /product/{product-id}/cross-selling-products:
    get:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - services
      deprecated: true
      summary: Cross-Selling
      operationId: GetCrossSellingProductsToInputImage
      description: |
        This endpoint suggests related products based on a source product, usually chosen by a user.
        The response contains a list of suggestions for each product.
      parameters:
        - $ref: "#/components/parameters/product-id"
        - name: cross-selling-products-count
          in: query
          schema:
            $ref: "#/components/schemas/resultsCount"
        - $ref: "#/components/parameters/campaigns"
        - $ref: "#/components/parameters/image-code"
        - $ref: "#/components/parameters/color"
        - $ref: "#/components/parameters/excluded"
      responses:
        "200":
          $ref: "#/components/responses/visual-product-recommendation"
        "400":
          $ref: "#/components/responses/generic-error"
        "401":
          $ref: "#/components/responses/authentication-error"
        "403":
          $ref: "#/components/responses/authorization-error"
  /mcp:
    post:
      security:
        - read-only-token: [ ]
        - site-credentials: [ ]
      tags:
        - mcp
      summary: MCP Endpoint
      operationId: McpEndpoint
      description: |
        Single JSON-RPC 2.0 endpoint that follows the [Model Context Protocol](https://modelcontextprotocol.io/specification/2025-11-25),
        served over the MCP *Streamable HTTP* transport.
        Use it to expose vviinn's services to agentic clients through one MCP connection
        instead of integrating each REST endpoint individually.

        The server is listed in the [MCP Registry](https://registry.modelcontextprotocol.io/?search=com.vviinn/commerce-context-layer) as `com.vviinn/commerce-context-layer`.

        Shops can also publish their own registry entry under their domain (e.g. `com.acme/shop`) that points at this endpoint with their site's read-only JWT pre-filled and a description tailored to their catalog. Setup uses the same [MCP publisher tooling](https://modelcontextprotocol.io/registry/quickstart) and DNS verification on the shop's domain.

        The shape of the JSON-RPC requests and responses is defined by the MCP specification and is intentionally not described here.
        Connect with any MCP-capable client and call `tools/list` to discover the tools available for your site, including their input and output schemas.

        ## Authorization

        Authenticate with the same credentials you already use for the REST API by setting one of:

        - `Authorization: Bearer <jwt>` — read-only JWT.
        - `Authorization: Basic <…>` — site credentials.

        The site is determined entirely from the credentials; there is no per-site URL and no path or query parameter.

        Some tools require elevated privileges, which are granted by the site's Basic credentials.
        They are documented in their respective section. 

        ## Tools

        The tools below are grouped by what they do.
        Each tool's input and output schemas are exposed at runtime via `tools/list`.

        ### Search and Discovery

        Each tool wraps an existing REST endpoint; use the REST documentation to understand the underlying behavior.

        | Tool | REST equivalent |
        | --- | --- |
        | `text_search` | [`POST /text-search`](#tag/services/operation/TextSearchProducts) |
        | `similar_products` | [`POST /similar-products`](#tag/services/operation/GetSimilarProducts) |
        | `cross_selling` | [`POST /cross-selling`](#tag/services/operation/GetCrossSellingProducts) |
        | `visual_search` | [`POST /visual-search`](#tag/services/operation/VisualSearchProducts) |

        ### Catalog

        Discovery tools that reveal the structure and contents of the catalog an agent is working with.

        | Tool | What it reveals |
        | --- | --- |
        | `list_relevant_columns` | The product columns worth working with in this catalog, each with its `type` and human-readable `label` — the actionable vocabulary an agent can filter on, build facets from, or use to describe the catalog. |
        | `describe_column` | The catalog-wide values of a single column — its distinct values, the category tree, a numeric range, or a true/false split — the full value space an agent can present, filter on, or validate input against. |
        | `get_item_group` | All variants belonging to an item group, looked up by its `item_group_id` — the complete set, not the possibly incomplete one a search result carries. |
        | `get_item` | The full record for a single product, looked up by its `id`. |
        | `get_items` | The full records for a batch of products, looked up by a list of `id`s — the plural sibling of `get_item`. |

        ### Memory

        Service-side, append-only conversation memory for agentic clients: append everything that happens during a conversation to a durable per-conversation log and recall it completely and in order.

        All memory tools require the site's Basic credentials; the read-only JWT does not authorize them.

        | Tool | Purpose |
        | --- | --- |
        | `append_memory` | Append a batch of items to a conversation's log. |
        | `recall_memory` | Return the last *count* items of a conversation, in order. |
        | `replay_memory` | Return *limit* items from a given offset — the positional read used to fully restore a conversation. |
        | `list_conversations` | List the conversation ids of the authenticated site with their created and last-appended timestamps. |
        | `summarize_conversation` | A condensed, up-to-date summary of a conversation so far — the gist instead of the full log. |
      responses:
        "200":
          description: |
            JSON-RPC 2.0 response. The body shape follows the MCP specification and is not described here.
        "401":
          description: |
            Missing or invalid credentials. The `WWW-Authenticate` header advertises the accepted schemes (`Bearer`, `Basic`).
        "403":
          description: Forbidden.
        "429":
          description: |
            Rate limit exceeded. The `Retry-After` header indicates when to retry.
components:
  securitySchemes:
    read-only-token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        This kind of token is used to authenticate read-only requests to the API.
        Each token belongs to a specific site and is valid until explicitly revoked.
        This token can be safely used in the browser, because it does not grant access to sensitive information.
        
        You can find your site's read-only token in the site settings.
    site-credentials:
      type: http
      scheme: basic
      description: |
        This set of credentials makes it possible to read potentially sensitive information from the API;
        it also allows to modify the site.
        There it is important to keep these credentials secret, e.g., by using them only on the server side.
        
        You can find your site's credentials in the site settings.
  parameters:
    product-id:
      name: product-id
      required: true
      in: path
      schema:
        $ref: "#/components/schemas/product-id"
    campaign-id:
      name: campaign-id
      in: query
      schema:
        $ref: "#/components/schemas/campaign-id"
    campaigns:
      name: campaigns
      in: query
      schema:
        description: comma-separated list of campaign ids
        type: string
        example: 127,185
    image-code:
      name: image-code
      in: query
      schema:
        $ref: "#/components/schemas/image-code"
    color:
      deprecated: true
      name: color
      in: query
      schema:
        $ref: "#/components/schemas/color"
    excluded:
      name: excluded[]
      in: query
      schema:
        type: array
        description: each item describes a column and values from that column that should be excluded from the result set
        items:
          description: the name of the column and the comma-separated list of values are separated by a colon
          type: string
        example:
          - "brand:Nike,Puma"
          - "custom_label_0:summer"
    category:
      name: category[]
      in: query
      schema:
        $ref: "#/components/schemas/category"
  schemas:
    request-id:
      type: string
      example: "6edf9d4d-60e8-49f3-b120-e89d728b8a89"
    product-id:
      type: string
      example: 120857
    campaign-id:
      oneOf:
        - type: integer
          example: 28
        - type: string
          example: 2d45fd08-9ba4-4f57-81d9-fe75069f64dd
    campaigns:
      description: list of campaign ids
      type: array
      items:
        $ref: "#/components/schemas/campaign-id"
    resultsCount:
      type: integer
      description: returns less than or equal to the campaign's defined results
      example: 8
    offset:
      type: integer
      minimum: 0
      default: 0
      description: |
        The position in the result list at which the returned page starts.
        Omit it, or send `0`, for the first page.

        To load the next page, send the number of results received so far, together with the `requestId`
        and the `dynamicFilters` the previous response reported. Keep `resultsCount` the same for every page of a list:
        changing it may repeat or skip results.

        A page with fewer results than `resultsCount` is the last one; an offset beyond the end returns an empty result.
        After changing the filters, start again at `0`.
      example: 8
    image-code:
      type: string
      example: "2"
    color:
      deprecated: true
      type: string
      pattern: ^[0-9a-fA-F]{6}$
      example: "12ff21"
    excluded:
      type: array
      description: each item describes a column and values from that column that should be excluded from the result set
      items:
        $ref: "#/components/schemas/value-list"
    included:
      type: array
      description: each item describes a column and values from that column that should be included in the result set
      items:
        $ref: "#/components/schemas/value-list"
    category:
      type: array
      description: each item describes a category path that should be used instead of the product's actual category paths
      items:
        $ref: "#/components/schemas/category-path"
      example:
        - cm9vdA
        - TcO2YmVsPlRpc2NoZQ
    energy-class-range:
      type: object
      properties:
        min:
          $ref: "#/components/schemas/energy-efficiency-class"
        max:
          $ref: "#/components/schemas/energy-efficiency-class"
    energy-certification-class-icon-urls:
      type: object
      required:
        - left
        - right
      properties:
        left:
          type: string
          format: uri
        right:
          type: string
          format: uri
    energy-certification:
      type: object
      properties:
        certificationClass:
          $ref: "#/components/schemas/energy-efficiency-class"
        classIconUrls:
          $ref: "#/components/schemas/energy-certification-class-icon-urls"
        classRange:
          $ref: "#/components/schemas/energy-class-range"
        classLabelUrl:
          type: string
          format: uri
        classDataSheetUrl:
          type: string
          format: uri
        productType:
          type: string
    energy-efficiency-class:
      type: string
      nullable: true
      enum:
        - A+++
        - A++
        - A+
        - A
        - B
        - C
        - D
        - E
        - F
        - G
      example: A+
      externalDocs:
        url: https://support.google.com/merchants/answer/7562785?hl=en&ref_topic=6324338
    ion-detected-object-rectangle:
      type: object
      properties:
        left:
          type: number
          example: 0
        top:
          type: number
          example: 0.3641
        width:
          type: number
          example: 0.94
        height:
          type: number
          example: 0.54175
    ion-detected-object-value:
      type: object
      required:
        - score
        - rectangle
      properties:
        classId:
          type: integer
        class:
          type: string
        score:
          type: integer
        rectangle:
          "$ref": "#/components/schemas/ion-detected-object-rectangle"
    ion-detected-object:
      type: object
      properties:
        value:
          "$ref": "#/components/schemas/ion-detected-object-value"
        links:
          additionalProperties:
            "$ref": "#/components/schemas/ion-link"
    ion-detected-objects:
      type: object
      properties:
        value:
          type: array
          items:
            "$ref": "#/components/schemas/ion-detected-object"
    delete-image-error:
      type: object
      properties:
        site-id:
          type: integer
          example: 25
        image-id:
          type: string
          example: "1"
    product-data:
      type: object
      properties:
