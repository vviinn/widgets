# Storybook doc links → their page on docs.vviinn.com. A link names the page as
# ?path=/docs/<id> (the Storybook UI) or ?id=<id> (iframe.html, which crawlers index).
map $arg_path $storybook_doc_id {
    ~*^(?:/|%2F)docs(?:/|%2F)(?<doc_id>[a-z0-9-]+--docs)  $doc_id;
    default                                                $arg_id;
}

map $storybook_doc_id $docs_redirect {
    default                                  "";
    welcome-to-vviinn-widgets--docs          /widgets/;
    getting-started-register--docs           /widgets/getting-started/register/;
    getting-started-installation--docs       /widgets/getting-started/installation/;
    widgets-search-modal--docs               /widgets/search-modal/;
    widgets-search-page--docs                /widgets/search-page/;
    widgets-discovery-slider--docs           /widgets/discovery-slider/;
    widgets-discovery-set--docs              /widgets/discovery-set/;
    widgets-one-click-discovery--docs        /widgets/one-click-discovery/;
    widgets-product-list-page--docs          /widgets/product-list-page/;
    widgets-shop-the-look--docs              /widgets/shop-the-look/;
    components-search-bar--docs              /widgets/components/search-bar/;
    components-product-list--docs            /widgets/components/product-list/;
    components-product-card--docs            /widgets/components/product-card/;
    components-filters--docs                 /widgets/components/filters/;
    components-cropper--docs                 /widgets/components/cropper/;
    customization-overview--docs             /widgets/customization/;
    customization-css-variables--docs        /widgets/customization/css-variables/;
    customization-target-styling--docs       /widgets/customization/target-styling/;
    customization-custom-content--docs       /widgets/customization/custom-content/;
    events-widget--docs                      /widgets/events/widget-events/;
    events-search--docs                      /widgets/events/search-events/;
    events-filters--docs                     /widgets/events/filters-events/;
    events-product--docs                     /widgets/events/product-events/;
    events-text-search--docs                 /widgets/events/text-search/;
    events-cropper--docs                     /widgets/events/cropper/;
    events-response--docs                    /widgets/events/response-events/;
}

server {
    listen 8080;

    root /var/www;

    if ($docs_redirect) {
        return 301 https://docs.vviinn.com$docs_redirect;
    }

    # HTML files - short cache to prevent stale resource references
    location ~ \.(html)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        if ($http_x_forwarded_proto = 'http') {
            return 301 https://$host$request_uri;
        }
    }

    # Assets with hashes (JS, CSS) - long cache (immutable)
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        if ($http_x_forwarded_proto = 'http') {
            return 301 https://$host$request_uri;
        }
    }

    # Root icons and brand logo - stable names, so cache without immutable
    location ~* ^/(favicon\.(svg|ico)|apple-touch-icon\.png|logo\.svg)$ {
        add_header Cache-Control "public, max-age=86400";
        if ($http_x_forwarded_proto = 'http') {
            return 301 https://$host$request_uri;
        }
    }

    # Storybook common assets - long cache
    location ~* ^/sb-.*\.(js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        if ($http_x_forwarded_proto = 'http') {
            return 301 https://$host$request_uri;
        }
    }

    # Default location
    location / {
        if ($http_x_forwarded_proto = 'http') {
            return 301 https://$host$request_uri;
        }
    }
}


server {
    listen 8080;
    server_name widgets.mediaopt.tools;

    root /var/www;

    location / {
        return 301 https://widgets.vviinn.com$request_uri;
    }
}

server {
    listen 8080;
    server_name widgets.stage.mediaopt.tools;

    root /var/www;

    location / {
        return 301 https://widgets.stage.vviinn.com$request_uri;
    }
}
